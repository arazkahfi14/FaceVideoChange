name: Build FaceSwap Local All APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract project
        run: |
          unzip -q FaceSwapLocalAllV2.zip
          test -f FaceSwapLocalAllV2/settings.gradle.kts
          echo "Project extracted successfully."

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: FaceSwapLocalAllV2
        run: gradle :app:assembleDebug --stacktrace

      - name: APK info
        run: |
          ls -lh FaceSwapLocalAllV2/app/build/outputs/apk/debug/
          sha256sum FaceSwapLocalAllV2/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FaceSwapLocal-All-APK-V2
          path: FaceSwapLocalAllV2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
